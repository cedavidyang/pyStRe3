[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyStRe3"
version = "0.1.0"
description = "Structural Reliability Analysis in Python 3"

# This automatically finds the 'pyStRe3' folder inside the repo
[tool.setuptools.packages.find]
where = ["."]
